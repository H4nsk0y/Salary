<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Голосование — Alvisa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <link rel="icon" type="image/png" sizes="48x48" href="./images/favicon-48.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon-180.png?v=4" />
  <link rel="shortcut icon" href="./images/favicon-64.png?v=4" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alvisa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: "Anticva";
      src: url("./fonts/Anticva-Regular.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --ink: #0b0d0f;
      --panel: #15191d;
      --panel-raised: #1a1f24;
      --line: rgba(241, 238, 232, 0.12);
      --muted: #9ca3ab;
      --porcelain: #f1eee8;
      --wine: #7a1638;
      --steel: #6ea8e8;
      --gold: #c6a15b;
    }

    html, body {
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--ink);
      color: var(--porcelain);
    }

    body {
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    .voting-shell {
      width: min(1280px, 100%);
    }

    .voting-kicker {
      color: var(--gold);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .voting-title,
    .period-title,
    .winner-name {
      font-family: Anticva, Georgia, serif;
      font-weight: 400;
      letter-spacing: 0;
    }

    .voting-title {
      margin-top: 10px;
      font-size: clamp(2.2rem, 5vw, 4.3rem);
      line-height: 1;
    }

    .voting-intro {
      max-width: 680px;
      color: #aeb3b8;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .voting-status,
    .voting-error {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(241, 238, 232, 0.035);
    }

    .voting-error {
      border-color: rgba(190, 74, 105, 0.32);
      background: rgba(122, 22, 56, 0.14);
      color: #efc8d4;
    }

    .period-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
    }

    .period-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--line);
    }

    .period-title {
      font-size: 1.75rem;
      line-height: 1.08;
    }

    .period-date {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .period-state {
      flex: 0 0 auto;
      border: 1px solid rgba(110, 168, 232, 0.26);
      border-radius: 5px;
      padding: 6px 9px;
      background: rgba(110, 168, 232, 0.07);
      color: #cbe2fb;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .result-area {
      min-height: 355px;
      padding: 24px 22px;
      background: #111519;
    }

    .result-caption,
    .vote-caption {
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .winner-stage {
      display: grid;
      justify-items: center;
      padding: 26px 0 10px;
      text-align: center;
    }

    .winner-avatar-wrap {
      position: relative;
      width: 112px;
      height: 112px;
    }

    .winner-avatar,
    .candidate-avatar {
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: #222930;
      color: #d9e9fb;
      font-weight: 800;
      object-fit: cover;
    }

    .winner-avatar {
      width: 112px;
      height: 112px;
      border: 2px solid rgba(198, 161, 91, 0.52);
      box-shadow: 0 0 0 7px rgba(198, 161, 91, 0.07);
      font-size: 1.55rem;
    }

    .winner-place {
      position: absolute;
      right: -4px;
      bottom: 2px;
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 3px solid #111519;
      border-radius: 50%;
      background: var(--gold);
      color: #17120a;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .winner-name {
      margin-top: 20px;
      max-width: 520px;
      font-size: 1.8rem;
      line-height: 1.12;
      overflow-wrap: anywhere;
    }

    .winner-department {
      margin-top: 7px;
      color: #aeb4ba;
      font-size: 0.78rem;
    }

    .winner-score {
      margin-top: 12px;
      color: #dec488;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .honorable {
      margin-top: 20px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      color: #aeb4ba;
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .honorable strong {
      color: #d6d9dc;
    }

    .empty-result {
      display: grid;
      min-height: 245px;
      place-items: center;
      padding: 30px 10px;
      color: #aeb4ba;
      text-align: center;
      line-height: 1.7;
    }

    .comments-details {
      margin-top: 20px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .comments-summary {
      cursor: pointer;
      color: #c6cbd0;
      font-size: 0.76rem;
      font-weight: 700;
      list-style: none;
    }

    .comments-summary::-webkit-details-marker {
      display: none;
    }

    .comments-summary::after {
      content: "+";
      float: right;
      color: var(--steel);
      font-size: 1rem;
    }

    details[open] .comments-summary::after {
      content: "−";
    }

    .comments-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .comment-item {
      border-left: 2px solid rgba(110, 168, 232, 0.36);
      padding: 3px 0 3px 12px;
    }

    .comment-about {
      color: #c9cdd1;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .comment-text {
      margin-top: 4px;
      color: #aeb4ba;
      font-size: 0.76rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .vote-area {
      padding: 22px;
    }

    .vote-form {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .field-label {
      display: grid;
      gap: 7px;
      color: #b8bdc2;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .vote-select,
    .vote-comment {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1316;
      color: var(--porcelain);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .vote-select {
      min-height: 44px;
      padding: 0 12px;
      cursor: pointer;
    }

    .vote-select option,
    .vote-select optgroup {
      background: #111519;
      color: var(--porcelain);
    }

    .vote-comment {
      min-height: 106px;
      resize: vertical;
      padding: 12px;
      line-height: 1.55;
    }

    .vote-select:focus,
    .vote-comment:focus {
      border-color: rgba(110, 168, 232, 0.62);
      box-shadow: 0 0 0 3px rgba(110, 168, 232, 0.1);
    }

    .candidate-preview {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: rgba(241, 238, 232, 0.025);
    }

    .candidate-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid rgba(110, 168, 232, 0.25);
      font-size: 0.76rem;
    }

    .candidate-name,
    .candidate-department {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-name {
      color: #e7e5df;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .candidate-department {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .vote-submit {
      min-height: 44px;
      border: 1px solid rgba(122, 22, 56, 0.62);
      border-radius: 6px;
      background: var(--wine);
      color: #fff7f8;
      font-size: 0.78rem;
      font-weight: 800;
      transition: background 160ms ease, opacity 160ms ease;
    }

    .vote-submit:hover:not(:disabled) {
      background: #8d1c45;
    }

    .vote-submit:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .vote-note,
    .voted-message {
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.55;
    }

    .voted-message {
      margin-top: 16px;
      border-left: 2px solid rgba(110, 168, 232, 0.5);
      padding: 6px 0 6px 12px;
      color: #cbe2fb;
    }

    @media (max-width: 640px) {
      .voting-title {
        font-size: 2.55rem;
      }

      .period-head,
      .result-area,
      .vote-area {
        padding-left: 16px;
        padding-right: 16px;
      }

      .period-title {
        font-size: 1.45rem;
      }

      .result-area {
        min-height: 330px;
      }

      .winner-name {
        font-size: 1.55rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body class="min-h-screen antialiased selection:bg-rose-900/50 selection:text-white">
  <div data-app-header data-active="voting"></div>

  <main class="voting-shell relative z-10 mx-auto px-4 pt-safe pb-12 sm:px-6 md:pb-16">
    <header class="mb-7 md:mb-9">
      <div class="voting-kicker">Выбор команды</div>
      <h1 class="voting-title">Голосование</h1>
      <p class="voting-intro mt-4">
        Выберите коллегу, чью работу хочется отметить. Голос и комментарий публикуются без имени, а результаты открываются только после завершения периода.
      </p>
    </header>

    <div id="votingStatus" class="voting-status mb-5 px-4 py-3 text-sm text-slate-300" aria-live="polite">
      Загружаю голосование…
    </div>
    <div id="votingError" class="voting-error hidden mb-5 px-4 py-3 text-sm" role="alert"></div>

    <section id="votingGrid" class="grid gap-5 xl:grid-cols-2" aria-label="Голосования недели и месяца"></section>
  </main>

  <div data-app-footer></div>

  <script type="module" src="./nav.js?v=20260820-1"></script>
  <script type="module" src="./voting.js?v=20260820-1"></script>
</body>
</html>
