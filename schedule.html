<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Смены сегодня и завтра — Alvisa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <link rel="icon" type="image/png" sizes="48x48" href="./images/favicon-48.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon-180.png?v=4" />
  <link rel="shortcut icon" href="./images/favicon-64.png?v=4" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alvisa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />


  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: "Anticva";
      src: url("./fonts/Anticva-Regular.otf") format("opentype");
      font-display: swap;
    }

    html, body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      scroll-behavior: smooth;
    }

    :root {
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(15, 23, 42, 0.62);
      --card-shadow: 0 25px 50px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --card-shadow-hover: 0 35px 70px -30px rgba(56, 189, 248, 0.36), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background: #020617;
      background-image:
        radial-gradient(850px 480px at 15% 8%, rgba(99, 102, 241, 0.18), transparent 60%),
        radial-gradient(720px 430px at 85% 18%, rgba(56, 189, 248, 0.14), transparent 60%),
        radial-gradient(900px 520px at 50% 90%, rgba(168, 85, 247, 0.10), transparent 60%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(148, 163, 184, 0.11) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.18;
      mask-image: radial-gradient(circle at 50% 20%, #000 30%, transparent 80%);
    }

    .glass-card {
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: var(--card-shadow-hover);
    }

    .pt-safe {
      padding-top: 7rem;
    }

    .hidden {
      display: none !important;
    }

    #scheduleDepartmentSelect option {
      background: #0f172a;
      color: #e2e8f0;
    }

    @media (min-width: 768px) {
      .pt-safe {
        padding-top: 6rem;
      }
    }

    :root {
      --alvisa-ink: #0b0d0f;
      --alvisa-graphite: #15191d;
      --alvisa-line: rgba(241, 238, 232, 0.11);
      --alvisa-muted: #9ca3ab;
      --alvisa-porcelain: #f1eee8;
      --alvisa-wine: #7a1638;
      --alvisa-steel: #6ea8e8;
      --alvisa-gold: #c6a15b;
    }

    body.schedule-page {
      background: var(--alvisa-ink);
      background-image: none;
      color: var(--alvisa-porcelain);
    }

    body.schedule-page::before,
    body.schedule-page::after {
      display: none;
    }

    .schedule-shell {
      max-width: 1400px;
    }

    .schedule-header {
      margin-bottom: 18px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--alvisa-line);
    }

    .schedule-eyebrow {
      border: 1px solid rgba(122, 22, 56, 0.38);
      border-radius: 5px !important;
      background: rgba(122, 22, 56, 0.16) !important;
      color: #e1b5c4 !important;
    }

    .schedule-heading {
      margin-top: 12px !important;
      font-family: "Anticva", Georgia, serif;
      font-size: 40px !important;
      font-weight: 400 !important;
      line-height: 1.08;
      letter-spacing: 0;
      color: var(--alvisa-porcelain);
    }

    .schedule-heading span {
      background: none !important;
      color: inherit !important;
      -webkit-text-fill-color: currentColor;
    }

    .schedule-controls {
      align-items: flex-end;
      padding: 12px;
      border: 1px solid var(--alvisa-line);
      border-radius: 8px;
      background: #111519;
    }

    .schedule-department-label > span:first-child {
      color: #929aa2 !important;
    }

    #scheduleDepartmentSelect {
      min-height: 42px;
      border: 1px solid rgba(110, 168, 232, 0.25) !important;
      border-radius: 6px !important;
      background: #0d1114 !important;
      color: var(--alvisa-porcelain);
      box-shadow: none !important;
    }

    #scheduleDepartmentSelect:focus {
      border-color: rgba(110, 168, 232, 0.68) !important;
      box-shadow: 0 0 0 3px rgba(110, 168, 232, 0.11) !important;
    }

    .schedule-control-button,
    .schedule-controls > label:not(.schedule-department-label) {
      min-height: 42px;
      border: 1px solid var(--alvisa-line) !important;
      border-radius: 6px !important;
      background: #171c21 !important;
      color: #c5cbd1 !important;
      box-shadow: none;
    }

    .schedule-control-button {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .schedule-department-label > span.relative,
    #scheduleDepartmentSelect {
      height: 42px;
    }

    #refreshBtn {
      border-color: rgba(198, 161, 91, 0.4) !important;
      background: rgba(198, 161, 91, 0.11) !important;
      color: #ead3a5 !important;
    }

    .schedule-status-line span {
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      box-shadow: none;
    }

    .glass-card {
      overflow: visible;
      border: 1px solid var(--alvisa-line);
      border-radius: 9px !important;
      background: var(--alvisa-graphite);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: border-color 180ms ease;
    }

    .glass-card:hover {
      border-color: rgba(241, 238, 232, 0.17);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2);
    }

    .schedule-summary {
      gap: 0 !important;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--alvisa-line);
      border-radius: 8px;
      background: var(--alvisa-graphite);
    }

    .schedule-summary > .glass-card {
      min-height: 94px;
      border: 0;
      border-right: 1px solid var(--alvisa-line);
      border-radius: 0 !important;
      background: transparent;
      padding: 17px 20px !important;
      box-shadow: none;
    }

    .schedule-summary > .glass-card:last-child {
      border-right: 0;
    }

    .schedule-summary > .glass-card > div:first-child {
      color: var(--alvisa-muted);
      font-size: 11px;
      letter-spacing: 0;
    }

    .schedule-summary > .glass-card > div[id] {
      margin-top: 8px;
      color: var(--alvisa-porcelain);
      font-size: 27px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    #daysGrid {
      gap: 14px;
    }

    .schedule-day-card {
      padding: 20px !important;
      border-top: 2px solid rgba(110, 168, 232, 0.42);
    }

    .schedule-day-title {
      font-family: "Anticva", Georgia, serif;
      font-size: 25px !important;
      font-weight: 400 !important;
      line-height: 1.2;
    }

    .schedule-day-count {
      min-width: 54px;
      border: 1px solid rgba(94, 187, 151, 0.24);
      border-radius: 7px !important;
      background: rgba(94, 187, 151, 0.08) !important;
      color: #a9ddc9 !important;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .schedule-person {
      min-height: 76px;
      border: 1px solid var(--alvisa-line) !important;
      border-radius: 7px !important;
      background: #101418 !important;
      box-shadow: none !important;
    }

    .schedule-person.is-night {
      border-color: rgba(182, 71, 107, 0.3) !important;
      background: rgba(122, 22, 56, 0.14) !important;
    }

    .schedule-person.is-self {
      border: 2px solid rgba(110, 168, 232, 0.72) !important;
      box-shadow: inset 3px 0 0 var(--alvisa-steel) !important;
    }

    .schedule-avatar {
      border-radius: 7px !important;
      border-color: rgba(110, 168, 232, 0.22) !important;
      background: rgba(110, 168, 232, 0.1) !important;
      color: #c9def5 !important;
    }

    .schedule-person-name {
      font-size: 15px !important;
      color: var(--alvisa-porcelain);
    }

    .schedule-person-meta {
      color: #89929b;
    }

    .schedule-shift-badge {
      border-radius: 5px !important;
      padding-top: 5px;
      padding-bottom: 5px;
    }

    .schedule-other {
      border: 1px solid var(--alvisa-line) !important;
      border-radius: 7px !important;
      background: #111519 !important;
    }

    #emptyState {
      border-radius: 8px;
      background: #111519;
    }

    @media (max-width: 1023px) {
      .schedule-controls {
        width: 100%;
      }
    }

    @media (max-width: 767px) {
      .schedule-shell {
        padding-left: 12px;
        padding-right: 12px;
      }

      .schedule-heading {
        font-size: 31px !important;
      }

      .schedule-controls {
        align-items: stretch;
      }

      .schedule-department-label {
        width: 100%;
      }

      .schedule-control-button,
      .schedule-controls > label:not(.schedule-department-label) {
        flex: 1 1 calc(50% - 4px);
        justify-content: center;
        text-align: center;
      }

      .schedule-summary {
        grid-template-columns: 1fr 1fr;
      }

      .schedule-summary > .glass-card {
        min-height: 86px;
        padding: 14px !important;
        border-bottom: 1px solid var(--alvisa-line);
      }

      .schedule-summary > .glass-card:nth-child(2) {
        border-right: 0;
      }

      .schedule-summary > .glass-card:last-child {
        grid-column: span 2;
        border-bottom: 0;
      }

      .schedule-day-card {
        padding: 15px !important;
      }

      .schedule-day-title {
        font-size: 22px !important;
      }

      .schedule-person {
        min-height: 72px;
      }
    }
  </style>
</head>

<body class="schedule-page min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/40 selection:text-white">
  <div data-app-header data-active="schedule"></div>

  <main class="schedule-shell relative z-10 mx-auto max-w-7xl px-4 pt-safe pb-12 md:pb-16">
    <header class="schedule-header mb-6">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <div class="schedule-eyebrow inline-flex items-center rounded-full bg-sky-500/10 px-3 py-1 text-xs font-semibold text-sky-200 ring-1 ring-sky-400/20">
            График отдела
          </div>
          <h1 class="schedule-heading mt-4 text-3xl font-bold tracking-tight md:text-4xl">
            <span class="bg-gradient-to-r from-indigo-200 via-sky-200 to-slate-100 bg-clip-text text-transparent">
              Сегодня и завтра на смене
            </span>
          </h1>
          <p id="departmentLabel" class="mt-2 text-sm text-slate-300/80">Загружаю отдел…</p>
        </div>

        <div class="schedule-controls flex flex-wrap items-center gap-2">
          <label class="schedule-department-label w-full sm:w-auto">
            <span class="mb-1.5 block text-[11px] font-semibold uppercase text-sky-200/80">Смотреть отдел</span>
            <span class="relative block">
              <select
                id="scheduleDepartmentSelect"
                class="min-h-[42px] w-full min-w-0 cursor-pointer appearance-none rounded-2xl border border-sky-400/35 bg-slate-950/90 px-4 py-2.5 pr-10 text-sm font-semibold text-slate-100 outline-none transition hover:bg-slate-900 focus:border-sky-400/60 focus:ring-2 focus:ring-sky-400/15 sm:min-w-[240px]"
                aria-label="Смотреть смены отдела"
              ></select>
              <span class="pointer-events-none absolute inset-y-0 right-3 grid place-items-center text-lg text-sky-200" aria-hidden="true">⌄</span>
            </span>
          </label>
          <a
            href="table.html"
            class="schedule-control-button rounded-2xl bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-200 ring-1 ring-white/15 transition-all hover:bg-white/10"
          >
            Мой табель
          </a>
          <button
            id="refreshBtn"
            type="button"
            class="schedule-control-button rounded-2xl bg-indigo-500/15 px-4 py-2.5 text-sm font-semibold text-indigo-200 ring-1 ring-indigo-400/30 transition-all hover:bg-indigo-500/20 hover:ring-indigo-300/50"
          >
            Обновить
          </button>
        </div>
      </div>

      <div class="schedule-status-line mt-3 flex flex-wrap items-center gap-2 text-xs">
        <span id="statusPill" class="inline-flex items-center rounded-full bg-white/5 px-4 py-1.5 text-slate-300 ring-1 ring-white/10">—</span>
        <span id="updatedAtPill" class="inline-flex items-center rounded-full bg-white/5 px-4 py-1.5 text-slate-400 ring-1 ring-white/10">—</span>
      </div>
    </header>

    <div id="errorBox" class="hidden mb-6 rounded-2xl bg-rose-500/15 p-4 text-sm text-rose-200 ring-1 ring-rose-500/25"></div>

    <section id="summaryGrid" class="schedule-summary mb-6 grid gap-4 md:grid-cols-3">
      <div class="glass-card rounded-3xl p-5">
        <div class="text-xs uppercase text-slate-400">Сегодня работают</div>
        <div id="todayWorkCount" class="mt-2 text-3xl font-bold text-emerald-200">0</div>
      </div>
      <div class="glass-card rounded-3xl p-5">
        <div class="text-xs uppercase text-slate-400">Завтра работают</div>
        <div id="tomorrowWorkCount" class="mt-2 text-3xl font-bold text-sky-200">0</div>
      </div>
      <div class="glass-card rounded-3xl p-5">
        <div class="text-xs uppercase text-slate-400">В отделе</div>
        <div id="departmentCount" class="mt-2 text-3xl font-bold text-slate-100">0</div>
      </div>
    </section>

    <section id="daysGrid" class="grid gap-5 lg:grid-cols-2"></section>

    <section id="emptyState" class="hidden rounded-3xl bg-slate-950/35 p-6 text-sm text-slate-300 ring-1 ring-white/10">
      Для вашего отдела пока нет данных по сменам. Если вы недавно зарегистрировались, проверьте приглашение или обратитесь к руководителю.
    </section>
  </main>

<script type="module" src="./nav.js?v=20260822-3"></script>
  <script type="module" src="./schedule.js"></script>
</body>
</html>
