<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Смены сегодня и завтра — Alvisa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <link rel="icon" type="image/png" sizes="48x48" href="./images/favicon-48.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon-180.png?v=4" />
  <link rel="shortcut icon" href="./images/favicon-64.png?v=4" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alvisa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />


  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    html, body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      scroll-behavior: smooth;
    }

    :root {
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(15, 23, 42, 0.62);
      --card-shadow: 0 25px 50px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --card-shadow-hover: 0 35px 70px -30px rgba(56, 189, 248, 0.36), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background: #020617;
      background-image:
        radial-gradient(850px 480px at 15% 8%, rgba(99, 102, 241, 0.18), transparent 60%),
        radial-gradient(720px 430px at 85% 18%, rgba(56, 189, 248, 0.14), transparent 60%),
        radial-gradient(900px 520px at 50% 90%, rgba(168, 85, 247, 0.10), transparent 60%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(148, 163, 184, 0.11) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.18;
      mask-image: radial-gradient(circle at 50% 20%, #000 30%, transparent 80%);
    }

    .glass-card {
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: var(--card-shadow-hover);
    }

    .pt-safe {
      padding-top: 7rem;
    }

    .hidden {
      display: none !important;
    }

    @media (min-width: 768px) {
      .pt-safe {
        padding-top: 6rem;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/40 selection:text-white">
  <div data-app-header data-active="schedule"></div>

  <main class="relative z-10 mx-auto max-w-7xl px-4 pt-safe pb-12 md:pb-16">
    <header class="mb-6">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <div class="inline-flex items-center rounded-full bg-sky-500/10 px-3 py-1 text-xs font-semibold text-sky-200 ring-1 ring-sky-400/20">
            График отдела
          </div>
          <h1 class="mt-4 text-3xl font-bold tracking-tight md:text-4xl">
            <span class="bg-gradient-to-r from-indigo-200 via-sky-200 to-slate-100 bg-clip-text text-transparent">
              Сегодня и завтра на смене
            </span>
          </h1>
          <p id="departmentLabel" class="mt-2 text-sm text-slate-300/80">Загружаю отдел…</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <label class="inline-flex items-center gap-2 rounded-2xl bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-200 ring-1 ring-white/15">
            <input id="hideRestCheckbox" type="checkbox" class="h-4 w-4 rounded border-white/20 bg-slate-950/70 accent-sky-400" />
            <span>Скрыть отсыпной</span>
          </label>
          <a
            href="table.html"
            class="rounded-2xl bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-200 ring-1 ring-white/15 transition-all hover:bg-white/10"
          >
            Мой табель
          </a>
          <button
            id="refreshBtn"
            type="button"
            class="rounded-2xl bg-indigo-500/15 px-4 py-2.5 text-sm font-semibold text-indigo-200 ring-1 ring-indigo-400/30 transition-all hover:bg-indigo-500/20 hover:ring-indigo-300/50"
          >
            Обновить
          </button>
        </div>
      </div>

      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
        <span id="statusPill" class="inline-flex items-center rounded-full bg-white/5 px-4 py-1.5 text-slate-300 ring-1 ring-white/10">—</span>
        <span id="updatedAtPill" class="inline-flex items-center rounded-full bg-white/5 px-4 py-1.5 text-slate-400 ring-1 ring-white/10">—</span>
      </div>
    </header>

    <div id="errorBox" class="hidden mb-6 rounded-2xl bg-rose-500/15 p-4 text-sm text-rose-200 ring-1 ring-rose-500/25"></div>

    <section id="summaryGrid" class="mb-6 grid gap-4 md:grid-cols-3">
      <div class="glass-card rounded-3xl p-5">
        <div class="text-xs uppercase text-slate-400">Сегодня работают</div>
        <div id="todayWorkCount" class="mt-2 text-3xl font-bold text-emerald-200">0</div>
      </div>
      <div class="glass-card rounded-3xl p-5">
        <div class="text-xs uppercase text-slate-400">Завтра работают</div>
        <div id="tomorrowWorkCount" class="mt-2 text-3xl font-bold text-sky-200">0</div>
      </div>
      <div class="glass-card rounded-3xl p-5">
        <div class="text-xs uppercase text-slate-400">В отделе</div>
        <div id="departmentCount" class="mt-2 text-3xl font-bold text-slate-100">0</div>
      </div>
    </section>

    <section id="daysGrid" class="grid gap-5 lg:grid-cols-2"></section>

    <section id="emptyState" class="hidden rounded-3xl bg-slate-950/35 p-6 text-sm text-slate-300 ring-1 ring-white/10">
      Для вашего отдела пока нет данных по сменам. Если вы недавно зарегистрировались, проверьте приглашение или обратитесь к руководителю.
    </section>
  </main>

  <script type="module" src="./nav.js"></script>
  <script type="module" src="./schedule.js"></script>
</body>
</html>
