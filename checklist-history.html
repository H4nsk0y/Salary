<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Архив смен — ALVISA SALARY</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" />
  <link rel="stylesheet" href="./styles/tailwind.css?v=20260920-1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @font-face { font-family: "Anticva"; src: url("./fonts/Anticva-Regular.otf") format("opentype"); font-display: swap; }
    :root { --ink:#0b0d0f; --panel:#15191d; --line:rgba(241,238,232,.12); --muted:#959ca2; --porcelain:#f1eee8; --gold:#c6a15b; }
    * { box-sizing: border-box; }
    html { min-height:100%; color-scheme:dark; }
    body { min-height:100vh; margin:0; background:var(--ink); color:var(--porcelain); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:0; }
    .hidden { display:none !important; }
    .page-shell { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:112px 0 40px; }
    .page-head { display:flex; align-items:end; justify-content:space-between; gap:20px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .eyebrow { margin:0 0 9px; color:#d5ba83; font-size:.7rem; font-weight:700; text-transform:uppercase; }
    h1 { margin:0; font-family:Anticva,Georgia,serif; font-size:3.35rem; font-weight:400; line-height:1; letter-spacing:0; }
    .head-copy { margin:11px 0 0; color:var(--muted); font-size:.82rem; line-height:1.5; }
    .back-link { display:inline-flex; min-height:42px; align-items:center; border:1px solid var(--line); border-radius:6px; padding:9px 13px; color:#c9cdd1; text-decoration:none; font-size:.75rem; font-weight:700; }
    .back-link:hover { border-color:rgba(241,238,232,.25); background:rgba(241,238,232,.05); }
    .notice { margin-top:20px; border:1px solid var(--line); border-radius:7px; padding:16px 18px; background:#101417; color:#aab0b5; font-size:.78rem; }
    .notice.error { border-color:rgba(190,74,105,.35); color:#e2a0ae; }
    .archive { margin-top:20px; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    .archive-head { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:19px 22px; border-bottom:1px solid var(--line); }
    .archive-title { font-size:.85rem; font-weight:700; }
    .archive-count { color:#d5ba83; font-size:.72rem; font-weight:700; }
    .entry { border-bottom:1px solid var(--line); }
    .entry:last-child { border-bottom:0; }
    .entry summary { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; min-height:66px; padding:13px 22px; cursor:pointer; list-style:none; }
    .entry summary::-webkit-details-marker { display:none; }
    .entry summary:hover { background:rgba(241,238,232,.025); }
    .entry-date { color:#dde0e2; font-size:.82rem; font-weight:650; }
    .entry-meta { margin-top:4px; color:#7f878d; font-size:.69rem; }
    .entry-percent { color:#d5ba83; font-size:.85rem; font-weight:800; }
    .items { display:grid; gap:8px; padding:0 22px 19px; }
    .item { display:grid; grid-template-columns:18px minmax(0,1fr); gap:8px; color:#899197; font-size:.75rem; line-height:1.45; }
    .item.done { color:#cdd2d5; }
    @media (max-width:620px) {
      .page-shell { width:calc(100% - 24px); padding-top:94px; }
      .page-head { align-items:flex-start; flex-direction:column; }
      h1 { font-size:2.5rem; }
      .back-link { width:100%; justify-content:center; }
      .archive-head,.entry summary { padding-left:17px; padding-right:17px; }
      .items { padding-left:17px; padding-right:17px; }
    }
  </style>
</head>
<body>
  <div data-app-header data-active="checklist"></div>
  <main class="page-shell">
    <header class="page-head">
      <div><p class="eyebrow">Личная история</p><h1>Архив смен</h1><p class="head-copy">Здесь хранятся завершённые чек-листы за последние два месяца.</p></div>
      <a class="back-link" href="checklist.html">Вернуться к чек-листу</a>
    </header>
    <div id="loadingNotice" class="notice">Загружаю архив…</div>
    <div id="errorNotice" class="notice error hidden" role="alert"></div>
    <section id="archive" class="archive hidden" aria-live="polite">
      <header class="archive-head"><div class="archive-title">Завершённые смены</div><div id="archiveCount" class="archive-count">0 смен</div></header>
      <div id="archiveList"></div>
    </section>
    <div id="emptyNotice" class="notice hidden">За последние два месяца завершённых чек-листов пока нет.</div>
  </main>
  <div data-app-footer></div>
  <script type="module" src="./js/nav.js?v=20260921-3"></script>
  <script type="module" src="./js/checklistHistory.js?v=20260924-1"></script>
</body>
</html>
