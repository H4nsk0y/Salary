<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Чат отдела — Alvisa</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <link rel="icon" type="image/png" sizes="48x48" href="./images/favicon-48.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon-180.png?v=4" />
  <link rel="shortcut icon" href="./images/favicon-64.png?v=4" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alvisa" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />


  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    html, body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      scroll-behavior: smooth;
    }

    :root {
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(15, 23, 42, 0.64);
      --card-shadow: 0 25px 50px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --card-shadow-hover: 0 35px 70px -30px rgba(99, 102, 241, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background: #020617;
      background-image:
        radial-gradient(900px 500px at 15% 10%, rgba(99, 102, 241, 0.18), transparent 60%),
        radial-gradient(700px 420px at 85% 20%, rgba(56, 189, 248, 0.15), transparent 60%),
        radial-gradient(900px 520px at 50% 90%, rgba(168, 85, 247, 0.12), transparent 60%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.4), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(56, 189, 248, 0.3), transparent 45%),
        radial-gradient(circle at 55% 85%, rgba(168, 85, 247, 0.2), transparent 45%);
      filter: blur(70px);
      opacity: 0.6;
      animation: bgFloat 18s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.2;
      mask-image: radial-gradient(circle at 50% 20%, #000 30%, transparent 80%);
    }

    @keyframes bgFloat {
      0% { transform: translate3d(-2%, -2%, 0) scale(1); }
      100% { transform: translate3d(3%, 3%, 0) scale(1.08); }
    }

    .glass-card {
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow);
      transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(600px 200px at 20% 0%, rgba(99, 102, 241, 0.3), transparent 60%),
        radial-gradient(500px 220px at 80% 10%, rgba(56, 189, 248, 0.25), transparent 60%);
      transition: opacity 0.5s ease;
    }

    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: var(--card-shadow-hover);
    }

    .glass-card:hover::before {
      opacity: 1;
    }

    .input-glass {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .input-glass:hover {
      background: rgba(2, 6, 23, 0.78);
      border-color: rgba(99, 102, 241, 0.28);
    }

    .input-glass:focus {
      outline: none;
      border-color: rgba(99, 102, 241, 0.8);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }

    .nav-link {
      position: relative;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 1rem;
      right: 1rem;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      border-radius: 2px;
      opacity: 0;
      transform: scaleX(0.7);
      transition: opacity 0.2s, transform 0.2s;
    }

    .nav-link.active::after,
    .nav-link:hover::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .mobile-top-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.125rem;
    }

    .mobile-top-nav a {
      white-space: nowrap;
    }

    .pt-safe {
      padding-top: 7rem;
    }

    .messages-scroll::-webkit-scrollbar {
      width: 10px;
    }

    .messages-scroll::-webkit-scrollbar-track {
      background: rgba(30, 41, 59, 0.55);
      border-radius: 999px;
    }

    .messages-scroll::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.55);
      border-radius: 999px;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.55) rgba(30, 41, 59, 0.55);
    }

    @media (min-width: 768px) {
      .pt-safe {
        padding-top: 6rem;
      }
    }

    @media (max-width: 640px) {
      .mobile-top-nav {
        flex-wrap: nowrap !important;
        justify-content: flex-start !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        max-width: calc(100vw - 92px);
        white-space: nowrap;
        touch-action: pan-x;
      }

      .mobile-top-nav::-webkit-scrollbar {
        display: none;
      }

      .mobile-top-nav a {
        flex: 0 0 auto;
        font-size: 0.72rem !important;
        padding: 5px 7px !important;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/40 selection:text-white">
  <div data-app-header data-active="chat"></div>

    <div class="relative z-10 mx-auto max-w-7xl px-4 pt-safe pb-12 md:pb-16">

  <div id="errorBox" class="hidden mb-6 rounded-2xl bg-rose-500/15 p-4 text-sm text-rose-200 ring-1 ring-rose-500/25 backdrop-blur-sm"></div>

  <section class="glass-card rounded-3xl p-4 md:p-5">
    <div class="mb-4 flex items-center justify-between gap-3">
      <div>
        <h2 class="text-lg font-semibold text-slate-100">Сообщения</h2>
        <p class="mt-1 text-sm text-slate-400">Виден только вашему отделу.</p>
      </div>
      <div id="memberHint" class="text-xs text-slate-400">—</div>
    </div>

    <div id="messagesList"
      class="messages-scroll h-[56vh] overflow-y-auto rounded-2xl bg-slate-950/30 p-3 ring-1 ring-white/10 md:p-4">
    </div>

    <form id="messageForm" class="mt-4">
      <div class="flex flex-col gap-3 md:flex-row">
        <textarea id="messageInput"
          rows="3"
          maxlength="2000"
          class="input-glass min-h-[56px] w-full rounded-2xl px-4 py-3 text-slate-100 placeholder:text-slate-500/80"
          placeholder="Напишите сообщение отделу..."></textarea>

        <button id="sendBtn" type="submit"
          class="rounded-2xl bg-gradient-to-b from-slate-800/90 to-slate-900/90 px-5 py-3 text-sm font-semibold text-slate-100 ring-1 ring-white/10 transition hover:shadow-[0_0_20px_rgba(99,102,241,0.45)] md:self-end">
          Отправить
        </button>
      </div>

      <div class="mt-2 flex items-center justify-between gap-3">
        <p class="text-xs text-slate-400">Enter — отправить, Shift+Enter — новая строка</p>
        <p id="charCounter" class="text-xs text-slate-400">0 / 2000</p>
      </div>
    </form>
  </section>
</div>

  <script type="module" src="./nav.js"></script>
  <script type="module" src="./chat.js"></script>
</body>
</html>
