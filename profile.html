<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль — Alvisa</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      html, body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      :root { --glow: rgba(99, 102, 241, 0.35); --glow2: rgba(56, 189, 248, 0.25); }

      body{
        position:relative;
        overflow-x:hidden;
        background:
          radial-gradient(900px 500px at 15% 10%, rgba(99, 102, 241, 0.12), transparent 60%),
          radial-gradient(700px 420px at 85% 20%, rgba(56, 189, 248, 0.10), transparent 60%),
          radial-gradient(900px 520px at 50% 90%, rgba(168, 85, 247, 0.08), transparent 60%),
          #020617;
      }
      body::before{
        content:"";
        position:fixed;
        inset:-25%;
        pointer-events:none;
        z-index:0;
        background:
          radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.28), transparent 45%),
          radial-gradient(circle at 80% 30%, rgba(56, 189, 248, 0.22), transparent 45%),
          radial-gradient(circle at 55% 85%, rgba(168, 85, 247, 0.14), transparent 45%);
        filter: blur(60px);
        opacity: 0.7;
        animation: bgFloat 12s ease-in-out infinite alternate;
      }
      @keyframes bgFloat { 0%{ transform: translate3d(-2%, -2%, 0) scale(1);} 100%{ transform: translate3d(2%, 2%, 0) scale(1.05);} }

      .reveal{ opacity:0; transform: translateY(18px); filter: blur(6px); transition: opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1), filter 700ms cubic-bezier(.2,.8,.2,1); }
      body.is-loaded .reveal{ opacity:1; transform:translateY(0); filter:blur(0); }

      .glass-card{ position:relative; overflow:hidden; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
      .glass-card::before{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        opacity:0;
        background:
          radial-gradient(600px 200px at 20% 0%, rgba(99, 102, 241, 0.35), transparent 60%),
          radial-gradient(500px 220px at 80% 10%, rgba(56, 189, 248, 0.25), transparent 60%);
        transition: opacity 350ms ease;
      }
      .glass-card:hover::before{ opacity:1; }

      .hover-lift{ transition: transform 250ms cubic-bezier(.2,.8,.2,1), box-shadow 250ms cubic-bezier(.2,.8,.2,1); }
      .hover-lift:hover{ transform: translateY(-4px); box-shadow: 0 20px 60px -40px var(--glow); }

      .input-glass{ transition: transform 180ms cubic-bezier(.2,.8,.2,1), box-shadow 180ms cubic-bezier(.2,.8,.2,1); }
      .input-glass:focus{
        transform: translateY(-1px);
        box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.35), 0 10px 40px -30px rgba(99, 102, 241, 0.55);
        outline:none;
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-white">
    <script>document.body.classList.add("is-loaded");</script>

    <div class="relative z-10 mx-auto max-w-5xl px-4 py-10">
      <header class="mb-6 reveal">
        <div class="flex items-center gap-3">
          <span class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500/30 to-sky-400/10 ring-1 ring-white/10 shadow-[0_20px_60px_-40px_rgba(99,102,241,0.6)] text-lg font-semibold text-slate-100/90" aria-hidden="true">A</span>

          <div class="flex-1">
            <h1 class="text-3xl font-semibold tracking-tight">
              <span class="bg-gradient-to-r from-indigo-200 via-sky-200 to-slate-100 bg-clip-text text-transparent">
                Профиль
              </span>
            </h1>
            <p class="mt-1 text-sm text-slate-300/90">Оклад, имя, аватар + история табелей.</p>
          </div>

          <button id="logoutBtn" class="rounded-2xl bg-white/5 px-4 py-2 text-sm font-semibold text-slate-200 ring-1 ring-white/10 hover:bg-white/10">
            Выйти
          </button>
        </div>
      </header>

      <div class="mb-6 flex gap-4 border-b border-white/10 pb-4 reveal">
        <a href="index.html" class="text-slate-300 hover:text-indigo-200">Калькулятор</a>
        <a href="table.html" class="text-slate-300 hover:text-indigo-200">Табель</a>
        <a href="profile.html" class="text-indigo-300 hover:text-indigo-200 font-medium">Профиль</a>
      </div>

      <div id="errorBox" class="hidden mb-6 rounded-2xl bg-rose-500/10 p-3 text-sm text-rose-200 ring-1 ring-rose-500/20 reveal"></div>
      <div id="infoBox" class="hidden mb-6 rounded-2xl bg-sky-500/10 p-3 text-sm text-sky-200 ring-1 ring-sky-500/20 reveal"></div>

      <main class="grid gap-6 lg:grid-cols-3 reveal">
        <section class="glass-card hover-lift rounded-3xl bg-slate-900/35 p-6 ring-1 ring-white/10 shadow-[0_20px_80px_-50px_rgba(99,102,241,0.45)] lg:col-span-1">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">Аватар</h2>
            <span id="roleBadge" class="hidden rounded-full bg-white/5 px-3 py-1 text-xs text-slate-200 ring-1 ring-white/10">роль</span>
          </div>

          <div class="mt-5 flex flex-col items-center">
            <div class="relative">
              <img id="avatarImg" src="" alt="Аватар" class="hidden h-28 w-28 rounded-full object-cover ring-1 ring-white/10 shadow-[0_20px_60px_-40px_rgba(56,189,248,0.55)]" />
              <div id="avatarFallback" class="flex h-28 w-28 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500/25 to-sky-400/10 ring-1 ring-white/10 text-3xl font-semibold text-slate-100/90">A</div>
              <div class="pointer-events-none absolute -inset-2 rounded-full opacity-70 blur-xl"
                   style="background: radial-gradient(circle at 30% 30%, rgba(99,102,241,.25), transparent 55%), radial-gradient(circle at 70% 60%, rgba(56,189,248,.20), transparent 55%);">
              </div>
            </div>

            <div class="mt-5 w-full space-y-2">
              <input id="avatarFile" type="file" accept="image/*" class="hidden" />
              <button id="uploadBtn" class="w-full rounded-2xl bg-gradient-to-b from-slate-800/90 to-slate-900/90 px-4 py-3 text-sm font-semibold text-slate-100 ring-1 ring-white/10 hover:bg-white/10 active:scale-[0.985]" type="button">
                Загрузить фото
              </button>

              <button id="removeBtn" class="w-full rounded-2xl bg-white/5 px-4 py-3 text-sm font-semibold text-slate-200 ring-1 ring-white/10 hover:bg-white/10 active:scale-[0.985]" type="button">
                Удалить фото
              </button>

              <p class="text-xs text-slate-400/90 leading-5">
                JPG/PNG/WebP. Лучше квадрат. Храним в Supabase Storage.
              </p>
            </div>
          </div>
        </section>

        <section class="glass-card hover-lift rounded-3xl bg-slate-900/35 p-6 ring-1 ring-white/10 shadow-[0_20px_80px_-50px_rgba(56,189,248,0.35)] lg:col-span-2">
          <h2 class="text-lg font-semibold">Данные аккаунта</h2>

          <form id="profileForm" class="mt-5 grid gap-4 sm:grid-cols-2" novalidate>
            <div class="sm:col-span-2">
              <label class="mb-1 block text-sm font-medium text-slate-200" for="displayName">Имя</label>
              <input id="displayName" class="input-glass w-full rounded-2xl bg-slate-950/45 px-4 py-3 text-slate-100 ring-1 ring-white/10 placeholder:text-slate-500/80 focus:outline-none focus:ring-2 focus:ring-indigo-400/80" placeholder="Напр. Альвиса" />
            </div>

            <div>
              <label class="mb-1 block text-sm font-medium text-slate-200" for="oklad">Оклад (₽)</label>
              <input id="oklad" inputmode="decimal" class="input-glass w-full rounded-2xl bg-slate-950/45 px-4 py-3 text-slate-100 ring-1 ring-white/10 placeholder:text-slate-500/80 focus:outline-none focus:ring-2 focus:ring-indigo-400/80" placeholder="Напр. 50000" />
              <p class="mt-1 text-xs text-slate-400/90">Подставится в калькулятор и табель.</p>
            </div>

            <div>
              <label class="mb-1 block text-sm font-medium text-slate-200" for="email">Email</label>
              <input id="email" disabled class="w-full rounded-2xl bg-slate-950/30 px-4 py-3 text-slate-200 ring-1 ring-white/10 opacity-80" />
              <p class="mt-1 text-xs text-slate-400/90">Только для чтения.</p>
            </div>

            <div class="sm:col-span-2 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between pt-2 border-t border-white/10">
              <div class="text-xs text-slate-400/90" id="statusLine">—</div>

              <button id="saveBtn" type="submit" class="rounded-2xl bg-gradient-to-b from-slate-800/90 to-slate-900/90 px-5 py-3 text-sm font-semibold text-slate-100 ring-1 ring-white/10 shadow-[0_18px_60px_-45px_rgba(99,102,241,0.6)] hover:shadow-[0_22px_70px_-45px_rgba(56,189,248,0.55)] active:scale-[0.985] focus:outline-none focus:ring-2 focus:ring-indigo-400/80">
                Сохранить
              </button>
            </div>
          </form>

          <div class="mt-6 pt-4 border-t border-white/10">
            <h3 class="text-base font-semibold">История табелей</h3>
            <p class="mt-1 text-sm text-slate-300/80">Открывай прошлые месяцы и скачивай Excel из табеля.</p>
            <div id="timesheetHistory" class="mt-3"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./profile.js"></script>
  </body>
</html>
