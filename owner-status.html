<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Состояние системы — ALVISA SALARY</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <link rel="apple-touch-icon" sizes="180x180" href="./images/favicon-180.png?v=4" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ALVISA SALARY" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" />
  <link rel="stylesheet" href="./styles/tailwind.css?v=20260825-1" />
  <link rel="stylesheet" href="./owner-console.css?v=20260802-1" />
  <style>
    .status-shell { width: min(1120px, 100%); }
    .status-title { font-family: "Anticva", Georgia, serif; font-weight: 400; letter-spacing: 0; }
    .status-panel { border: 1px solid var(--owner-line); border-radius: 7px; background: var(--owner-panel); }
    .status-check { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: start; gap: 14px; padding: 18px 0; border-top: 1px solid var(--owner-line); }
    .status-check:first-child { border-top: 0; padding-top: 0; }
    .status-check:last-child { padding-bottom: 0; }
    .status-dot { width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: #969ca2; }
    .status-dot.ok { background: #6ea8e8; box-shadow: 0 0 0 4px rgba(110,168,232,.1); }
    .status-dot.warn { background: #c6a15b; box-shadow: 0 0 0 4px rgba(198,161,91,.1); }
    .status-dot.error { background: #c35166; box-shadow: 0 0 0 4px rgba(195,81,102,.1); }
    .status-button { border-radius: 6px; background: #7a1638; color: #f1eee8; }
    .status-button:hover { background: #8c1b42; }
    @media (max-width: 640px) { .status-check { grid-template-columns: 12px minmax(0, 1fr); } .status-check-time { grid-column: 2; } }
  </style>
</head>
<body class="owner-console min-h-screen antialiased">
  <div data-app-header data-active="owner" data-owner-nav="true"></div>
  <main class="status-shell relative z-10 mx-auto px-4 pt-safe pb-12 sm:px-6 md:pb-16">
    <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-xs uppercase text-slate-500">Владелец</p>
        <h1 class="status-title mt-2 text-4xl text-[#f1eee8]">Состояние системы</h1>
        <p id="summaryText" class="mt-3 text-sm text-[#969ca2]">Проверка ещё не запускалась.</p>
      </div>
      <button id="refreshStatusBtn" type="button" class="status-button px-5 py-3 text-sm font-semibold transition">Проверить сейчас</button>
    </header>

    <section class="grid gap-4 sm:grid-cols-3" aria-label="Итоги проверки">
      <div class="status-panel p-5"><div class="text-xs text-[#969ca2]">Исправно</div><div id="okCount" class="mt-2 text-3xl text-[#f1eee8]">0</div></div>
      <div class="status-panel p-5"><div class="text-xs text-[#969ca2]">Требует внимания</div><div id="warnCount" class="mt-2 text-3xl text-[#c6a15b]">0</div></div>
      <div class="status-panel p-5"><div class="text-xs text-[#969ca2]">Недоступно</div><div id="errorCount" class="mt-2 text-3xl text-[#c35166]">0</div></div>
    </section>

    <section class="status-panel mt-5 p-5 md:p-6">
      <div id="statusChecks"></div>
    </section>

    <div class="mt-5 flex flex-wrap gap-3 text-sm">
      <a href="owner-analytics.html#clientErrorsTitle" class="text-[#6ea8e8] hover:text-[#9ac4f2]">Открыть журнал ошибок</a>
      <a href="owner.html" class="text-[#969ca2] hover:text-[#f1eee8]">Вернуться к отделам</a>
    </div>
  </main>
  <div data-app-footer></div>
  <script type="module" src="./nav.js?v=20260906-2"></script>
  <script type="module" src="./owner-status.js?v=20260906-1"></script>
  <script type="module" src="./footer.js?v=20260802-2"></script>
</body>
</html>
