<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — Alvisa</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      html, body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      :root { --glow: rgba(99, 102, 241, 0.35); --glow2: rgba(56, 189, 248, 0.25); }

      body {
        position: relative;
        overflow-x: hidden;
        background:
          radial-gradient(900px 500px at 15% 10%, rgba(99, 102, 241, 0.12), transparent 60%),
          radial-gradient(700px 420px at 85% 20%, rgba(56, 189, 248, 0.10), transparent 60%),
          radial-gradient(900px 520px at 50% 90%, rgba(168, 85, 247, 0.08), transparent 60%),
          #020617;
      }

      body::before{
        content:"";
        position:fixed;
        inset:-25%;
        pointer-events:none;
        z-index:0;
        background:
          radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.28), transparent 45%),
          radial-gradient(circle at 80% 30%, rgba(56, 189, 248, 0.22), transparent 45%),
          radial-gradient(circle at 55% 85%, rgba(168, 85, 247, 0.14), transparent 45%);
        filter: blur(60px);
        opacity: 0.7;
        transform: translate3d(0,0,0);
        animation: bgFloat 12s ease-in-out infinite alternate;
      }

      body::after{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:0;
        background-image: radial-gradient(rgba(148, 163, 184, 0.11) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.25;
        mask-image: radial-gradient(circle at 50% 20%, #000 30%, transparent 72%);
      }

      @keyframes bgFloat {
        0% { transform: translate3d(-2%, -2%, 0) scale(1); }
        100% { transform: translate3d(2%, 2%, 0) scale(1.05); }
      }

      .reveal{
        opacity:0;
        transform: translateY(18px);
        filter: blur(6px);
        transition:
          opacity 700ms cubic-bezier(.2,.8,.2,1),
          transform 700ms cubic-bezier(.2,.8,.2,1),
          filter 700ms cubic-bezier(.2,.8,.2,1);
        will-change: opacity, transform, filter;
      }
      body.is-loaded .reveal{ opacity:1; transform:translateY(0); filter:blur(0); }

      .glass-card{
        position:relative;
        overflow:hidden;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .glass-card::before{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        opacity:0;
        background:
          radial-gradient(600px 200px at 20% 0%, rgba(99, 102, 241, 0.35), transparent 60%),
          radial-gradient(500px 220px at 80% 10%, rgba(56, 189, 248, 0.25), transparent 60%);
        transition: opacity 350ms ease;
      }
      .glass-card:hover::before{ opacity:1; }

      .hover-lift{
        transition:
          transform 250ms cubic-bezier(.2,.8,.2,1),
          box-shadow 250ms cubic-bezier(.2,.8,.2,1),
          border-color 250ms ease;
      }
      .hover-lift:hover{
        transform: translateY(-4px);
        box-shadow: 0 20px 60px -40px var(--glow), 0 14px 40px -28px rgba(0,0,0,.7);
      }

      .input-glass{
        transition:
          transform 180ms cubic-bezier(.2,.8,.2,1),
          box-shadow 180ms cubic-bezier(.2,.8,.2,1),
          border-color 180ms ease,
          background-color 180ms ease;
      }
      .input-glass:focus{
        transform: translateY(-1px);
        box-shadow:
          0 0 0 1px rgba(99, 102, 241, 0.35),
          0 10px 40px -30px rgba(99, 102, 241, 0.55);
      }

      .shake { animation: shake 320ms ease-in-out; }
      @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(6px); }
        75% { transform: translateX(-4px); }
        100% { transform: translateX(0); }
      }

      .tab-active{
        background: linear-gradient(to bottom, rgba(30,41,59,.8), rgba(15,23,42,.8));
        border-color: rgba(99,102,241,.35);
        color: rgba(224,231,255,.95);
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-white">
    <script>  
    document.body.classList.add("is-loaded");
    </script>
    <div class="relative z-10 mx-auto max-w-5xl px-4 py-10">
      <header class="mb-8 reveal">
        <div class="inline-flex items-center gap-3">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500/30 to-sky-400/10 ring-1 ring-white/10 shadow-[0_20px_60px_-40px_rgba(99,102,241,0.6)] text-lg font-semibold text-slate-100/90"
            aria-hidden="true"
          >A</span>

          <div>
            <h1 class="text-3xl font-semibold tracking-tight">
              <span class="bg-gradient-to-r from-indigo-200 via-sky-200 to-slate-100 bg-clip-text text-transparent">
                Alvisa — аккаунт
              </span>
            </h1>
            <p class="mt-1 text-sm text-slate-300/90">Вход или регистрация для сохранения табеля.</p>
          </div>
        </div>
      </header>

      <div class="mb-6 flex gap-4 border-b border-white/10 pb-4 reveal">
        <a href="index.html" class="text-slate-300 hover:text-indigo-200">Калькулятор зарплаты</a>
        <a href="table.html" class="text-slate-300 hover:text-indigo-200">Табель учёта</a>
        <span class="ml-auto text-indigo-300 font-medium">Вход</span>
      </div>

      <main class="reveal">
        <section class="glass-card hover-lift mx-auto max-w-xl rounded-3xl bg-slate-900/35 p-6 ring-1 ring-white/10 shadow-[0_20px_80px_-50px_rgba(99,102,241,0.45)]">
          <div class="flex gap-2">
            <button id="tabSignIn" type="button"
              class="tab-active flex-1 rounded-2xl border border-white/10 px-4 py-2 text-sm font-semibold text-slate-100 transition">
              Вход
            </button>
            <button id="tabSignUp" type="button"
              class="flex-1 rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-200 hover:bg-white/10 transition">
              Регистрация
            </button>
          </div>

          <form id="authForm" class="mt-5 space-y-4" novalidate>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-200" for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                class="input-glass w-full rounded-2xl bg-slate-950/45 px-4 py-3 text-slate-100 ring-1 ring-white/10 placeholder:text-slate-500/80 focus:outline-none focus:ring-2 focus:ring-indigo-400/80"
              />
            </div>

            <div>
              <label class="mb-1 block text-sm font-medium text-slate-200" for="password">Пароль</label>
              <div class="relative">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="••••••••••"
                  class="input-glass w-full rounded-2xl bg-slate-950/45 px-4 py-3 pr-12 text-slate-100 ring-1 ring-white/10 placeholder:text-slate-500/80 focus:outline-none focus:ring-2 focus:ring-indigo-400/80"
                />
                <button
                  id="togglePw"
                  type="button"
                  class="absolute inset-y-0 right-2 my-auto rounded-xl bg-white/5 px-3 py-2 text-xs text-slate-200 ring-1 ring-white/10 hover:bg-white/10"
                >Показать</button>
              </div>

              <p id="pwHint" class="mt-1 text-xs text-slate-400/90">
                Минимум 10 символов, верхний/нижний регистр, цифра и символ.
              </p>
            </div>

            <div id="confirmWrap" class="hidden">
              <label class="mb-1 block text-sm font-medium text-slate-200" for="confirmPassword">Повторите пароль</label>
              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••••"
                class="input-glass w-full rounded-2xl bg-slate-950/45 px-4 py-3 text-slate-100 ring-1 ring-white/10 placeholder:text-slate-500/80 focus:outline-none focus:ring-2 focus:ring-indigo-400/80"
              />
            </div>

            <div id="errorBox" class="hidden rounded-2xl bg-rose-500/10 p-3 text-sm text-rose-200 ring-1 ring-rose-500/20"></div>
            <div id="infoBox" class="hidden rounded-2xl bg-sky-500/10 p-3 text-sm text-sky-200 ring-1 ring-sky-500/20"></div>

            <button
              id="submitBtn"
              type="submit"
              class="w-full rounded-2xl bg-gradient-to-b from-slate-800/90 to-slate-900/90 px-4 py-3 font-semibold text-slate-100 ring-1 ring-white/10 shadow-[0_18px_60px_-45px_rgba(99,102,241,0.6)] transition-transform duration-150 hover:shadow-[0_22px_70px_-45px_rgba(56,189,248,0.55)] hover:ring-indigo-400/30 active:scale-[0.985] focus:outline-none focus:ring-2 focus:ring-indigo-400/80"
            >
              Войти
            </button>

            <p class="text-xs text-slate-400/80 leading-5">
              После входа табель будет сохраняться в аккаунте.
            </p>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="./login.js"></script>
  </body>
</html>
