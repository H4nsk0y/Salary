<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Архив бюджета — ALVISA SALARY</title>
  <link rel="stylesheet" href="./styles/tailwind.css?v=20260920-1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="./styles/pages/budget.css?v=20261121-3">
  <link rel="stylesheet" href="./styles/page-loader.css?v=20261002-1">
</head>
<body class="budget-page">
  <div id="alvisaPageLoader" class="alvisa-page-loader" role="status" aria-live="polite" aria-label="Загрузка данных"></div>
  <script src="./js/pageLoaderBoot.js?v=20261002-1"></script>
  <div data-app-header data-active="budget"></div>
  <main class="budget-shell">
    <header class="budget-heading"><h1>Архив бюджета</h1><a class="budget-link" href="budget.html">Мой бюджет</a></header>
    <p id="status" role="status" aria-live="polite">Загружаем расходы…</p>
    <div id="budgetLocked" hidden><button id="unlock" type="button">Показать расходы</button></div>
    <div id="budgetContent" hidden>
      <section class="budget-section">
        <div class="line"><h2 id="categoryHeading">По категориям</h2><button id="refresh" class="plain" type="button" title="Обновить" aria-label="Обновить архив">↻</button></div>
        <div class="month"><input id="month" type="hidden"><label id="monthLabel" for="expenseMonth">Месяц</label><select id="expenseMonth" aria-label="Месяц"></select><select id="expenseYear" aria-label="Год"></select></div>
        <div id="archiveStats" class="budget-archive-stats"><strong id="monthTotal"></strong><div id="stats"></div></div>
      </section>
      <section class="budget-section">
        <div class="budget-tabs" role="tablist" aria-label="Архив"><button id="archivedTab" role="tab" aria-selected="true" aria-controls="archiveRows" class="plain" type="button">В архиве</button><button id="allTab" role="tab" aria-selected="false" aria-controls="archiveRows" class="plain" type="button">Все расходы</button><button id="billsTab" role="tab" aria-selected="false" aria-controls="archiveRows" class="plain" type="button">Платежи</button></div>
        <p id="retentionNote" class="section-status">Записи расходов хранятся один календарный месяц. Их удаление не меняет остаток денег.</p>
        <div id="archiveRows" role="tabpanel"></div>
      </section>
    </div>
  </main>
  <a href="budget-help.html#archives" class="budget-help-button" aria-label="Как работает архив бюджета" title="Как работает архив бюджета"><span aria-hidden="true">?</span></a>
  <dialog id="dialog" class="budget-dialog" aria-labelledby="dialogTitle">
    <form id="editor" novalidate>
      <header class="line"><h2 id="dialogTitle">Расход</h2><button id="close" class="plain" type="button" aria-label="Закрыть">×</button></header>
      <div class="dialog-body"><div id="fields">
        <div class="budget-field"><label for="archiveTitle">Название</label><input id="archiveTitle" maxlength="90"></div>
        <div class="budget-field"><label for="archiveAmount">Сумма в ₽</label><input id="archiveAmount" type="number" min="0.01" max="1000000000" step="0.01" required></div>
        <div class="budget-field"><label for="archiveCategory">Категория</label><select id="archiveCategory"></select></div>
      </div><p id="error" role="alert"></p></div>
      <footer class="line"><button id="remove" class="plain" type="button">Удалить</button><button id="submit" type="submit">Сохранить</button></footer>
    </form>
  </dialog>
  <dialog id="confirm" class="budget-confirm" aria-label="Удалить расход?"><h2>Удалить расход?</h2><button id="cancelDelete" class="plain" type="button">Оставить</button><button id="confirmDelete" type="button">Удалить</button></dialog>
  <div data-app-footer></div>
  <script type="module" src="./js/nav.js?v=20261121-1"></script>
  <script type="module" src="./js/budgetArchive.js?v=20261121-3"></script>
</body>
</html>
