<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Учебный табель — ALVISA SALARY</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png?v=4" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://isdayoff.ru; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" />
  <link rel="stylesheet" href="./styles/tailwind.css?v=20260920-1" />
  <style>
    @font-face { font-family: Anticva; src: url("./fonts/Anticva-Regular.otf") format("opentype"); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d0f; color: #f1eee8; font-family: Inter, system-ui, sans-serif; }
    .lab-shell { width: min(1600px, 100%); margin: 0 auto; padding: 112px 22px 60px; }
    .lab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid rgba(241,238,232,.14); }
    .lab-head h1 { margin: 0; font: 400 clamp(2rem, 3vw, 3rem)/1 Anticva, Georgia, serif; }
    .lab-head a { color: #bcd8f6; font-size: .8rem; text-decoration: none; }
    .lab-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 19px 0; }
    .lab-controls label { display: grid; gap: 5px; color: #b9c0c7; font-size: .72rem; }
    .lab-controls select, .lab-controls input, .lab-person select, .lab-person input { min-height: 37px; border: 1px solid rgba(241,238,232,.18); border-radius: 5px; padding: 6px 8px; background: #15191d; color: #f1eee8; font: inherit; }
    .lab-controls select { min-width: 118px; }
    .lab-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 18px; border-bottom: 1px solid rgba(241,238,232,.12); }
    .lab-actions button, .lab-footer button { min-height: 38px; border: 1px solid rgba(110,168,232,.32); border-radius: 6px; padding: 7px 11px; background: rgba(110,168,232,.08); color: #d3e6fa; font-size: .75rem; font-weight: 700; cursor: pointer; }
    .lab-actions button[aria-pressed="true"], .lab-footer button:not(:disabled) { border-color: rgba(198,161,91,.44); background: rgba(198,161,91,.14); color: #ead3a5; }
    .lab-footer button:disabled { opacity: .45; cursor: not-allowed; }
    .lab-preview { display: flex; flex-wrap: wrap; align-items: start; gap: 14px; padding: 15px 0; min-height: 70px; }
    .lab-preview p { margin: 0; color: #c9ced3; font-size: .78rem; line-height: 1.6; }
    .lab-preview-list { max-height: 120px; overflow: auto; margin: 0; padding-left: 18px; color: #c9ced3; font-size: .73rem; line-height: 1.7; }
    .lab-footer { display: flex; gap: 8px; }
    .lab-table-wrap { width: 100%; overflow: auto; border: 1px solid rgba(241,238,232,.14); border-radius: 7px; }
    .lab-table { border-collapse: separate; border-spacing: 0; min-width: max-content; width: 100%; font-size: .72rem; }
    .lab-table th, .lab-table td { width: 41px; height: 40px; border-right: 1px solid rgba(241,238,232,.08); border-bottom: 1px solid rgba(241,238,232,.08); text-align: center; }
    .lab-table thead th { position: sticky; top: 0; z-index: 2; background: #1d2227; color: #c9ced3; }
    .lab-table th:first-child { position: sticky; left: 0; z-index: 3; width: 300px; min-width: 300px; text-align: left; padding: 7px 10px; background: #15191d; }
    .lab-table td:last-child, .lab-table th:last-child { width: 125px; min-width: 125px; border-right: 0; }
    .lab-table td input { display: block; width: 100%; height: 39px; border: 0; outline: 0; padding: 3px; background: transparent; color: #f1eee8; text-align: center; font: inherit; }
    .lab-table td input:focus { background: rgba(110,168,232,.16); box-shadow: inset 0 0 0 1px #6ea8e8; }
    .lab-table .lab-weekend { background: rgba(198,161,91,.055); }
    .lab-table .lab-holiday { background: rgba(122,22,56,.13); }
    .lab-person { display: grid; gap: 5px; }
    .lab-person strong { font-size: .77rem; }
    .lab-person div { display: flex; gap: 5px; }
    .lab-person select { width: 108px; min-height: 28px; font-size: .69rem; }
    .lab-person input { width: 64px; min-height: 28px; font-size: .69rem; }
    .lab-row-night th { color: #8baac9; }
    .lab-total { padding: 6px; color: #d5c5a5; white-space: nowrap; }
    .lab-error { color: #ecb0bf !important; }
    @media (max-width: 640px) { .lab-shell { padding: 94px 12px 40px; } .lab-head { flex-direction: column; } .lab-table th:first-child { width: 150px; min-width: 150px; } .lab-person div { flex-direction: column; } }
  </style>
</head>
<body>
  <div data-app-header data-active="owner" data-owner-nav="true"></div>
  <main class="lab-shell" id="labShell" hidden>
    <header class="lab-head"><h1>Учебный табель</h1><a href="owner.html">Все отделы</a></header>
    <div class="lab-controls">
      <label>Месяц<select id="labMonth"></select></label>
      <label>Год<input id="labYear" type="number" min="2000" max="2100" /></label>
      <label>Сотрудников<input id="labCount" type="number" min="2" max="30" value="4" /></label>
      <label>Календарь<select id="labBranch"><option value="">Общий</option><option value="chateau_alvisa">ШАТО АЛВИСА</option></select></label>
    </div>
    <div class="lab-actions" id="labActions" role="group" aria-label="Шаблоны графика">
      <button type="button" data-tool="dayNight48">День / ночь / 48</button>
      <button type="button" data-tool="twoDaysTwoNights48">2 дня / 2 ночи / 48</button>
      <button type="button" data-tool="bottling">График от розлива</button>
      <button type="button" data-tool="fiveTwo">5/2 по 8 ч</button>
      <button type="button" data-tool="alternating">8 ч / 6+2</button>
      <button type="button" data-tool="fillNorm">Добить до нормы</button>
      <button type="button" data-tool="reduceOvertime">Сократить переработку</button>
    </div>
    <div class="lab-preview"><p id="labStatus" role="status" aria-live="polite">Выберите инструмент.</p><ul id="labPreviewList" class="lab-preview-list"></ul><div class="lab-footer"><button id="labApply" type="button" disabled>Применить</button><button id="labReset" type="button">Очистить</button></div></div>
    <div class="lab-table-wrap"><table class="lab-table"><thead><tr id="labHeader"></tr></thead><tbody id="labBody"></tbody></table></div>
  </main>
  <div id="labDenied" class="lab-shell" hidden>Учебный табель доступен только владельцу.</div>
  <div data-app-footer></div>
  <script type="module" src="./js/nav.js?v=20260920-1"></script>
  <script type="module" src="./js/features/scheduleLab.js?v=20260916-1"></script>
</body>
</html>
