
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-табель — Alvisa</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      html, body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      :root {
        --glass-bg: rgba(15, 23, 42, 0.64);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      body {
        position: relative;
        overflow-x: hidden;
        background: #020617;
        background-image:
          radial-gradient(900px 500px at 15% 10%, rgba(99, 102, 241, 0.18), transparent 60%),
          radial-gradient(700px 420px at 85% 20%, rgba(56, 189, 248, 0.15), transparent 60%),
          radial-gradient(900px 520px at 50% 90%, rgba(168, 85, 247, 0.12), transparent 60%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: -25%;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.4), transparent 45%),
          radial-gradient(circle at 80% 30%, rgba(56, 189, 248, 0.3), transparent 45%),
          radial-gradient(circle at 55% 85%, rgba(168, 85, 247, 0.2), transparent 45%);
        filter: blur(70px);
        opacity: 0.6;
        animation: bgFloat 18s ease-in-out infinite alternate;
      }

      @keyframes bgFloat {
        0% { transform: translate3d(-2%, -2%, 0) scale(1); }
        100% { transform: translate3d(3%, 3%, 0) scale(1.08); }
      }

      .glass-card {
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow:
          0 25px 50px -20px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .input-glass {
        background: rgba(2, 6, 23, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      }

      .input-glass:hover {
        background: rgba(2, 6, 23, 0.78);
        border-color: rgba(99, 102, 241, 0.28);
      }

      .input-glass:focus {
        outline: none;
        border-color: rgba(99, 102, 241, 0.8);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      .select-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .select-wrap::after {
        content: "▾";
        position: absolute;
        right: 12px;
        color: rgba(148, 163, 184, 0.9);
        pointer-events: none;
        font-size: 13px;
      }

      select.ui-select {
        appearance: none;
        -webkit-appearance: none;
        background-color: rgba(2, 6, 23, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(226, 232, 240, 0.95);
        border-radius: 1rem;
        padding: 8px 34px 8px 14px;
        font-size: 0.92rem;
        line-height: 1.2;
        outline: none;
        backdrop-filter: blur(8px);
        transition: all 0.2s;
      }

      select.ui-select:hover {
        background-color: rgba(2, 6, 23, 0.84);
        border-color: rgba(99, 102, 241, 0.4);
      }

      select.ui-select:focus {
        border-color: rgba(99, 102, 241, 0.8);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      .scrollable {
  overflow-x: auto;
  overflow-y: visible;
  border-radius: 1rem;
  -webkit-overflow-scrolling: touch;
}

      .admin-matrix {
  border-collapse: collapse;
  width: max-content;
  min-width: 1320px;
  background: rgba(30, 41, 59, 0.52);
  border-radius: 1rem;
  overflow: hidden;
}

      .admin-matrix th,
.admin-matrix td {
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  text-align: center;
  min-width: 58px;
}

      .admin-matrix th {
        background: rgba(15, 23, 42, 0.86);
        color: #94a3b8;
        font-size: 0.88rem;
        font-weight: 600;
        padding: 10px 4px 8px;
        user-select: none;
      }

      .admin-matrix td {
        padding: 8px 2px;
      }

      .th-dow {
        display: block;
        font-size: 9px;
        font-weight: 400;
        opacity: 0.55;
        margin-top: 2px;
      }

      .label-cell {
  position: sticky;
  left: 0;
  z-index: 4;
  min-width: 190px;
  width: 190px;
  background: rgba(12, 20, 44, 0.98);
  color: #e2e8f0;
  text-align: left !important;
  padding: 10px 12px !important;
  white-space: nowrap;
  border-right: 1px solid rgba(255, 255, 255, 0.12) !important;
}

      .label-main {
        display: block;
        font-size: 0.92rem;
        font-weight: 700;
        color: rgba(241, 245, 249, 0.98);
      }

      .label-sub {
        display: block;
        margin-top: 2px;
        font-size: 0.72rem;
        color: rgba(148, 163, 184, 0.92);
      }

      .label-cell.night .label-sub {
        color: rgba(254, 202, 202, 0.92);
      }

      .summary-head {
  position: sticky;
  right: 0;
  z-index: 5;
  min-width: 220px;
  width: 220px;
  background: rgba(12, 20, 44, 0.98) !important;
  border-left: 1px solid rgba(255, 255, 255, 0.12) !important;
}

      .summary-cell {
  position: sticky;
  right: 0;
  z-index: 3;
  min-width: 220px;
  width: 220px;
  background: rgba(8, 15, 34, 0.98);
  border-left: 1px solid rgba(255, 255, 255, 0.1) !important;
  padding: 10px !important;
}

      .summary-box {
        text-align: left;
        display: grid;
        gap: 8px;
      }

      .summary-main {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.78rem;
        color: rgba(148, 163, 184, 0.95);
      }

      .summary-main strong {
        font-size: 1rem;
        color: rgba(241, 245, 249, 0.98);
        font-weight: 800;
      }

      .summary-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.76rem;
        color: rgba(148, 163, 184, 0.95);
      }

      .summary-line strong {
        color: rgba(226, 232, 240, 0.98);
        font-weight: 700;
      }

      .summary-line.muted strong {
        color: rgba(196, 181, 253, 0.98);
      }

      .weekend-col {
        background-color: rgba(239, 68, 68, 0.15) !important;
      }

      .holiday-col {
        background-color: rgba(245, 158, 11, 0.2) !important;
      }

      .transferred-col {
        background-color: rgba(59, 130, 246, 0.16) !important;
      }

      .admin-matrix th.transferred-col {
        background-color: rgba(59, 130, 246, 0.2) !important;
      }

      .short-col {
        background-color: rgba(16, 185, 129, 0.16) !important;
      }

      .admin-matrix th.weekend-col {
        background-color: rgba(239, 68, 68, 0.2) !important;
      }

      .admin-matrix th.holiday-col {
        background-color: rgba(245, 158, 11, 0.24) !important;
      }

      .admin-matrix th.short-col {
        background-color: rgba(16, 185, 129, 0.2) !important;
      }

      .employee-day-row td {
  background-color: rgba(255, 255, 255, 0.012);
}

      .employee-night-row td {
        background-color: rgba(255, 255, 255, 0.028);
      }

      .person-divider td {
          border-bottom: 2px solid rgba(129, 140, 248, 0.22) !important;
          box-shadow: none;
        }

      .person-divider .summary-cell,
      .person-divider .label-cell {
        border-bottom: 2px solid rgba(129, 140, 248, 0.34) !important;
      }

      .overtime-row td {
        background-color: rgba(244, 63, 94, 0.05);
      }

      .overtime-row .label-cell,
      .overtime-row .summary-cell {
        background-color: rgba(76, 5, 25, 0.96) !important;
      }

      .overtime-row .input-hour {
          border-color: rgba(251, 113, 133, 0.28);
          box-shadow: none;
        }

      .overtime-row-top td {
        box-shadow: none;
      }

      .overtime-row-bottom td {
        box-shadow: none;
      }

      .overtime-row .label-main {
        color: rgba(255, 228, 230, 0.98);
      }

      .overtime-row .label-sub {
        color: rgba(253, 164, 175, 0.92);
      }

      /* чтобы праздничные / сокращенные дни не теряли свою логику, но переработка была видна */
      .overtime-row .holiday-col,
      .overtime-row.holiday-col,
      .overtime-row-top .holiday-col,
      .overtime-row-bottom .holiday-col {
        box-shadow:
          inset 0 2px 0 rgba(251, 113, 133, 0.55),
          inset 0 -2px 0 rgba(251, 113, 133, 0.55);
      }

      .overtime-row .short-col,
      .overtime-row.short-col,
      .overtime-row-top .short-col,
      .overtime-row-bottom .short-col {
        box-shadow:
          inset 0 2px 0 rgba(251, 113, 133, 0.55),
          inset 0 -2px 0 rgba(251, 113, 133, 0.55);
      }

      .input-hour {
  width: 54px;
  min-width: 54px;
  padding: 8px 4px;
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: white;
  text-align: center;
  font-size: 0.9rem;
  text-transform: uppercase;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

      .input-hour:focus {
        outline: none;
        border-color: rgba(99, 102, 241, 0.8);
        box-shadow: none;
        background: rgba(0, 0, 0, 0.48);
      }

      td.night-cell .input-hour {
        color: rgba(254, 202, 202, 0.95);
      }

      .hidden {
        display: none !important;
      }

      .shake {
        animation: shake 0.3s ease-in-out;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-5px); }
        40% { transform: translateX(5px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.55);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.55);
        border-radius: 999px;
        border: 2px solid rgba(30, 41, 59, 0.55);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.8);
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(99, 102, 241, 0.55) rgba(30, 41, 59, 0.55);
      }

      @media (max-width: 1024px) {
        .label-cell {
          min-width: 170px;
        }

        .summary-head,
        .summary-cell {
          min-width: 200px;
        }
      }

      @media (max-width: 768px) {
  .input-hour {
    width: 50px;
    min-width: 50px;
    min-height: 44px;
    font-size: 16px;
  }

  .label-cell {
    min-width: 150px;
    width: 150px;
  }

  .summary-head,
  .summary-cell {
    min-width: 180px;
    width: 180px;
  }
}

      /* ========= Мобильная панель (аналог table.html) ========= */
#mobileBar {
  display: none;
}
@media (max-width: 767px) {
  #mobileBar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: -webkit-sticky;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 48px);
    z-index: 40;
    background: rgba(2, 6, 23, 0.96);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 8px 10px;
    margin-bottom: 12px;
  }
}
    .mbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }
    #mHolidayBtn.is-active {
      background: rgba(245, 158, 11, 0.22) !important;
      color: rgba(253, 186, 64, 1) !important;
      border-color: rgba(245, 158, 11, 0.45) !important;
    }

    #mTransferredBtn.is-active {
      background: rgba(59, 130, 246, 0.2) !important;
      color: rgba(147, 197, 253, 1) !important;
      border-color: rgba(59, 130, 246, 0.45) !important;
    }

    #mShortBtn.is-active {
      background: rgba(16, 185, 129, 0.2) !important;
      color: rgba(52, 211, 153, 1) !important;
      border-color: rgba(16, 185, 129, 0.45) !important;
    }
    /* Подсветка выбранной колонки */
    .focus-col {
  outline: 2px solid rgba(56, 189, 248, 0.55);
  outline-offset: -2px;
  box-shadow: none !important;
}

    .admin-matrix th.focus-col,
    .admin-matrix td.focus-col {
      outline: 2px solid rgba(56, 189, 248, 0.55);
      outline-offset: -2px;
      box-shadow: none !important;
    }

    </style>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/40 selection:text-white">
    <div class="relative z-10 mx-auto max-w-[1600px] px-4 py-8 md:py-10">
      <header class="mb-6">
        <div class="flex flex-col gap-4 rounded-3xl border border-white/10 bg-slate-950/55 p-4 backdrop-blur-xl md:p-5">
          <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex items-center gap-3">
              <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500/40 to-sky-400/20 ring-1 ring-white/15 text-lg font-bold text-slate-100">A</span>
              <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight">
                  <span class="bg-gradient-to-r from-indigo-200 via-sky-200 to-slate-100 bg-clip-text text-transparent">
                    Табель команды
                  </span>
                </h1>
                <p id="monthYearDisplay" class="mt-1 text-sm text-slate-300/80">—</p>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <a
                id="backToTableLink"
                href="table.html"
                class="rounded-2xl bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-200 ring-1 ring-white/15 backdrop-blur-sm transition hover:bg-white/10"
              >Личный табель</a>

              <button
                id="reloadBtn"
                class="rounded-2xl bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-200 ring-1 ring-white/15 backdrop-blur-sm transition hover:bg-white/10"
              >Обновить</button>

              <button
                id="saveBtn"
                class="rounded-2xl bg-gradient-to-b from-slate-800/90 to-slate-900/90 px-5 py-2.5 text-sm font-semibold text-slate-100 ring-1 ring-white/10 transition hover:shadow-[0_0_20px_rgba(99,102,241,0.45)]"
              >Сохранить всем</button>

              <button
                id="logoutBtn"
                class="rounded-2xl bg-white/5 px-4 py-2.5 text-sm font-semibold text-slate-200 ring-1 ring-white/15 transition hover:bg-white/10"
              >Выйти</button>
            </div>
          </div>

          <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-2 rounded-2xl bg-white/5 px-3 py-2 ring-1 ring-white/10">
                <label class="text-xs text-slate-300" for="monthSelect">Месяц</label>
                <span class="select-wrap">
                  <select id="monthSelect" class="ui-select">
                    <option value="0">Янв</option>
                    <option value="1">Фев</option>
                    <option value="2">Мар</option>
                    <option value="3">Апр</option>
                    <option value="4">Май</option>
                    <option value="5">Июн</option>
                    <option value="6">Июл</option>
                    <option value="7">Авг</option>
                    <option value="8">Сен</option>
                    <option value="9">Окт</option>
                    <option value="10">Ноя</option>
                    <option value="11">Дек</option>
                  </select>
                </span>

                <label class="ml-2 text-xs text-slate-300" for="yearSelect">Год</label>
                <span class="select-wrap">
                  <select id="yearSelect" class="ui-select"></select>
                </span>
              </div>

              <span id="saveStatus" class="inline-flex items-center rounded-full bg-white/5 px-4 py-1.5 text-xs text-slate-300 ring-1 ring-white/10">—</span>
            </div>

            <!-- <div class="text-xs text-slate-400">
              Клик по дню — <span class="text-amber-300">праздник</span>, двойной клик — <span class="text-emerald-300">сокращённый</span>. Метка применяется сразу ко всем.
            </div> -->
          </div>
        </div>
      </header>

      <div id="errorBox" class="hidden mb-6 rounded-2xl bg-rose-500/15 p-4 text-sm text-rose-200 ring-1 ring-rose-500/25 backdrop-blur-sm"></div>

      <section class="mb-6 grid gap-4 md:grid-cols-3">
        <div class="glass-card rounded-3xl p-5">
          <div class="text-sm text-slate-400">Сотрудников в табеле</div>
          <div id="teamCount" class="mt-2 text-3xl font-bold text-slate-100">4</div>
         
        </div>

        <div class="glass-card rounded-3xl p-5">
          <div class="text-sm text-slate-400">Норма по календарю (месяц)</div>
          <div id="normMonth" class="mt-2 text-3xl font-bold text-slate-100">—</div>
        </div>

        <div class="glass-card rounded-3xl p-5">
          <div class="text-sm text-slate-400">Норма по календарю (1–15)</div>
          <div id="normFirstHalf" class="mt-2 text-3xl font-bold text-slate-100">—</div>
        </div>
      </section>

      <section class="glass-card rounded-3xl p-5 md:p-6">
        <div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <h2 class="text-xl font-semibold text-slate-100">Матрица табеля</h2>
            <p class="mt-1 text-sm text-slate-400">
              Справа по каждому сотруднику: <span class="text-slate-200">часы 1-я половина / месяц</span> и <span class="text-slate-200">норма 1-я половина / месяц</span>.
            </p>
          </div>

          <div class="text-xs text-slate-400">
            Коды: <span class="text-slate-200">ОТ</span>, <span class="text-slate-200">ОД</span>, <span class="text-slate-200">ОЗ</span>, <span class="text-slate-200">У</span>, <span class="text-slate-200">УД</span>, <span class="text-slate-200">Б</span>
          </div>
        </div>

        <!-- Мобильная панель навигации по дням -->
        <div id="mobileBar">
          <div class="mbar-row">
            <button id="mPrevDay" type="button"
              class="rounded-xl bg-white/5 px-3 py-2 text-base font-bold text-slate-200 ring-1 ring-white/10 hover:bg-white/10 active:scale-95 min-w-[36px] text-center">‹</button>
            <div id="mDayLabel" class="flex-1 text-center text-sm font-semibold text-slate-100 select-none tabular-nums min-w-[72px]">—</div>
            <button id="mNextDay" type="button"
              class="rounded-xl bg-white/5 px-3 py-2 text-base font-bold text-slate-200 ring-1 ring-white/10 hover:bg-white/10 active:scale-95 min-w-[36px] text-center">›</button>
            <button id="mToday" type="button"
              class="rounded-xl bg-white/5 px-3 py-1.5 text-xs font-semibold text-slate-200 ring-1 ring-white/10 hover:bg-white/10 active:scale-95 whitespace-nowrap">Сегодня</button>
          </div>
          <div class="mbar-row">
          <button id="mHolidayBtn" type="button"
            class="flex-1 rounded-xl bg-white/5 px-3 py-2 text-xs font-semibold text-slate-300 ring-1 ring-white/10 hover:bg-white/10 active:scale-95 text-center transition-all">🎉 Праздник</button>
          <button id="mTransferredBtn" type="button"
            class="flex-1 rounded-xl bg-white/5 px-3 py-2 text-xs font-semibold text-slate-300 ring-1 ring-white/10 hover:bg-white/10 active:scale-95 text-center transition-all">🔁 Перенос</button>
          <button id="mShortBtn" type="button"
            class="flex-1 rounded-xl bg-white/5 px-3 py-2 text-xs font-semibold text-slate-300 ring-1 ring-white/10 hover:bg-white/10 active:scale-95 text-center transition-all">✂️ Сокращ.</button>
        </div>
        </div>

        <div class="scrollable" id="tableScrollable">
          <table class="admin-matrix">
            <thead>
              <tr id="headerRow"></tr>
            </thead>
            <tbody id="matrixBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
