<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Сотрудники отдела — ALVISA SALARY</title>
  <link rel="icon" href="./images/favicon-32.png" />
  <link rel="stylesheet" href="./styles/tailwind.css" />
  <link rel="stylesheet" href="./styles/page-loader.css" />
  <link rel="stylesheet" href="./styles/pages/department-users.css" />
  <meta name="theme-color" content="#0b0d0f" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'" />
</head>
<body>
  <div id="alvisaPageLoader" class="alvisa-page-loader" role="status" aria-live="polite"></div>
  <script src="./js/pageLoaderBoot.js"></script>
  <div data-app-header data-active="profile"></div>
  <main class="department-users-shell">
    <header class="department-users-header">
      <div><h1>Сотрудники отдела</h1><p id="departmentName">Загрузка…</p></div>
      <a id="departmentTableLink" href="admin.html" class="department-button">Общий табель</a>
    </header>
    <p id="departmentUsersError" role="alert" hidden></p>
    <div class="department-users-toolbar">
      <input id="employeeSearch" type="search" placeholder="Найти сотрудника" aria-label="Найти сотрудника" />
      <span id="employeeCount" role="status"></span>
    </div>
    <div id="departmentUsersList"></div>
  </main>
  <dialog id="employeeDialog" aria-labelledby="employeeDialogTitle">
    <header><h2 id="employeeDialogTitle"></h2><button type="button" data-close aria-label="Закрыть">×</button></header>
    <div id="employeeDialogBody"></div>
  </dialog>
  <div data-app-footer></div>
  <script type="module" src="./js/nav.js"></script>
  <script type="module" src="./js/department-users.js"></script>
</body>
</html>
